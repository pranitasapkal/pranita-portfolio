<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Contract Management prototype</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;background:#F2F5FA}
  #stage{position:relative;width:1280px}
  #stage img{display:block;width:1280px;height:auto;user-select:none;-webkit-user-drag:none}
  .hl{position:absolute;pointer-events:none}
  .go{position:absolute;cursor:pointer;border-radius:6px;outline:2px solid transparent;transition:outline-color .15s,background-color .15s}
  .go:hover,.go:focus-visible{outline-color:rgba(42,103,255,.65);background:rgba(42,103,255,.06)}
  body.hints .go{outline-color:rgba(42,103,255,.35)}
</style>
</head>
<body>
<div id="stage"><img id="frame" alt=""></div>
<script>
/* Contract Management prototype: real Figma frames ("Contract Management- Transporter", Untitled.fig).
   Each scene is one exported frame. `hl` boxes are highlight targets for the case-study reels (data-hl),
   `go` boxes are click-through hotspots. Coordinates are in the exported image's pixels (1024 wide, except
   dispute-sub at 916), scaled to 1280 at render. Contract: window.__vt.scene(name), window.__vt.scenes. */
var TABS_A = [["pending",193,197,90,24],["upcoming",286,197,100,24],["active",392,197,80,24],["closed",476,197,82,24]];
var TABS_B = [["pending",193,133,90,24],["upcoming",286,133,100,24],["active",392,133,80,24],["closed",476,133,82,24]];
var S = {
  "pending": {hl:{overview:[200,120,582,54],deadline:[200,340,72,15],accept:[949,318,53,23],rejectbtn:[955,349,40,16]},
    go:[["pending-accept",949,318,53,23],["reject",955,349,40,16],["pending-reminders",202,121,236,52]].concat(TABS_A)},
  "pending-reminders": {hl:{reminders:[560,12,464,792],modal:[560,12,464,792]},
    go:[["pending",985,22,22,22],["pending-accept",585,206,104,23]]},
  "pending-accept": {hl:{modal:[560,12,464,794],back:[573,79,142,14],total:[818,406,124,28],accept:[890,755,114,31]},
    go:[["pending-reminders",573,79,142,14],["pending",810,755,72,31],["pending",985,24,22,22],["accepted",890,755,114,31]]},
  "accepted": {hl:{modal:[352,244,320,318],toast:[380,436,264,52]},
    go:[["upcoming",603,523,57,29],["upcoming",640,256,22,22]]},
  "reject": {hl:{modal:[311,166,402,445],loss:[324,423,376,43],reasons:[324,490,376,33]},
    go:[["reject-reasons",324,490,376,33],["pending",499,573,71,30],["pending",680,176,22,22]]},
  "reject-reasons": {hl:{modal:[326,122,401,450],loss:[339,379,375,43],reasons:[340,486,374,133]},
    go:[["reject-rate",349,495,355,29],["pending",695,132,22,22]]},
  "reject-rate": {hl:{modal:[326,106,401,617],loss:[339,363,375,44],rateinput:[338,494,376,53]},
    go:[["reject-done",594,686,120,31],["pending",514,686,70,31],["pending",695,116,22,22]]},
  "reject-done": {hl:{toast:[710,756,250,32]}, go:[["reject-undone",920,764,36,16]].concat(TABS_A)},
  "reject-undone": {hl:{toast:[750,757,266,32]}, go:TABS_A},
  "upcoming": {hl:{starts:[200,276,64,15],view:[924,254,78,23]},
    go:[["upcoming-reject",924,254,78,23]].concat(TABS_B)},
  "upcoming-reject": {hl:{modal:[311,76,402,650],loss:[324,334,376,74],rateinput:[324,497,376,52]},
    go:[["upcoming",499,688,71,30],["upcoming",680,86,22,22]]},
  "active": {hl:{chips:[200,166,264,46],review:[806,333,88,26],tag:[200,336,116,14],reissued:[200,585,90,30],cdispute:[928,406,66,16]},
    go:[["rate-review",925,313,73,23],["active-l2",923,375,77,23],["dispute-sub",928,406,66,16],["ending",380,167,83,44]].concat(TABS_B)},
  "rate-review": {hl:{modal:[311,222,402,406],rates:[324,309,376,146],valmonote:[566,365,116,74],terminatebtn:[445,589,128,30]},
    go:[["active",680,232,22,22],["terminate",445,589,128,30],["active",582,589,118,30]]},
  "active-l2": {hl:{tripprogress:[193,351,175,240],missed:[848,522,145,20],terminatebtn:[777,773,108,20],cdispute:[901,767,99,31]},
    go:[["active",194,52,20,22],["terminate",777,773,108,20],["dispute-sub",901,767,99,31]]},
  "terminate": {hl:{modal:[311,163,402,470],loss:[324,420,376,95],reasons:[324,527,376,32]},
    go:[["terminate-reasons",324,527,376,32],["active-l2",487,595,71,30],["terminated",567,595,133,30],["active-l2",680,173,22,22]]},
  "terminate-reasons": {hl:{modal:[311,134,402,470],loss:[324,392,376,96],reasons:[325,537,374,134]},
    go:[["terminated",334,546,356,29],["active-l2",680,144,22,22]]},
  "terminated": {hl:{modal:[352,244,320,318],toast:[372,436,280,52]},
    go:[["ending",603,523,57,29],["ending",640,256,22,22]]},
  "ending": {hl:{chips:[200,166,264,46],banner:[200,268,812,32],tag:[200,375,98,40]},
    go:[["active",201,167,67,44]].concat(TABS_B)},
  "closed": {hl:{status:[[200,276,157,16],[200,348,98,16],[200,410,62,16],[200,473,94,16],[200,535,105,16],[200,598,72,16]]},
    go:TABS_B},
  "empty-pending": {hl:{empty:[486,422,232,134]}, go:TABS_A},
  "dispute-sub": {w:916, hl:{coexist:[172,50,734,44],cats:[182,166,312,28],sub:[182,395,312,184],dsubmit:[847,982,57,30]},
    go:[["active",172,12,18,22],["dispute-done",847,982,57,30]]},
  "dispute-error": {hl:{error:[200,188,350,50]}, go:[["active",196,15,18,22]]},
  "dispute-done": {hl:{modal:[352,260,320,287],toast:[364,404,296,72]},
    go:[["active",583,509,77,29],["active",640,271,22,22]]}
};
var stage = document.getElementById("stage"), img = document.getElementById("frame"), current = null;
function box(r, k){ return "left:"+(r[0]*k)+"px;top:"+(r[1]*k)+"px;width:"+(r[2]*k)+"px;height:"+(r[3]*k)+"px"; }
function scene(name){
  if(!S[name]) name = "pending";
  current = name;
  var s = S[name], k = 1280/(s.w||1024);
  [].slice.call(stage.querySelectorAll(".hl,.go")).forEach(function(n){ n.remove(); });
  img.src = "frames/"+name+".webp";
  img.alt = "Contract Management: "+name.replace(/-/g," ");
  Object.keys(s.hl||{}).forEach(function(key){
    var v = s.hl[key], list = (typeof v[0] === "number") ? [v] : v;
    list.forEach(function(r){ var d = document.createElement("div"); d.className = "hl"; d.setAttribute("data-hl", key); d.style.cssText = box(r,k); stage.appendChild(d); });
  });
  (s.go||[]).forEach(function(g){
    var a = document.createElement("div"); a.className = "go"; a.tabIndex = 0; a.setAttribute("role","button");
    a.setAttribute("aria-label","Go to "+g[0].replace(/-/g," ")); a.style.cssText = box(g.slice(1),k);
    a.onclick = function(){ scene(g[0]); };
    a.onkeydown = function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); scene(g[0]); } };
    stage.appendChild(a);
  });
  window.scrollTo(0,0);
  return true;
}
/* Preload every frame so scene changes are instant inside the reels. */
Object.keys(S).forEach(function(n){ var i = new Image(); i.src = "frames/"+n+".webp"; });
window.__vt = { scene: scene, scenes: Object.keys(S) };
/* Interactive (lightbox) use: press H to flash the clickable areas. */
document.addEventListener("keydown", function(e){ if(e.key==="h"||e.key==="H"){ document.body.classList.add("hints"); setTimeout(function(){ document.body.classList.remove("hints"); }, 1200); } });
scene("pending");
</script>
</body>
</html>
