<rect id="accent-bar" x="39" y="71" width="120" height="3" fill="#DE1D3E"/>
<text id="name" x="39" y="118" font-family="Poppins, sans-serif" font-size="30" font-weight="600" fill="#333333">Pranita Sapkal</text>
<text id="role" x="39" y="143" font-family="Poppins, sans-serif" font-size="15" font-weight="500" fill="#DE1D3E">Product Designer</text>
<text id="summary" x="39" y="167" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#616161"><tspan x="39" dy="0">Product designer for the platforms that run one of</tspan><tspan x="39" dy="21">India's largest logistics networks. On Meesho's</tspan><tspan x="39" dy="21">Valmo network I'm the sole designer behind three</tspan><tspan x="39" dy="21">products taken from 0→1 to launch: the systems that</tspan><tspan x="39" dy="21">plan trips, manage transporters, and run vendor</tspan><tspan x="39" dy="21">contracts, now used by transporters and managers</tspan><tspan x="39" dy="21">across India. Partnering with product and</tspan><tspan x="39" dy="21">engineering, I design the operating model, not just</tspan><tspan x="39" dy="21">the screens. Earlier: 3 years across web, mobile,</tspan><tspan x="39" dy="21">and design systems.</tspan></text>
</g>
