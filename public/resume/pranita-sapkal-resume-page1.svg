<g id="left-page1">
<g id="header-professional-experience"><text x="39" y="406" font-family="Poppins, sans-serif" font-size="20" font-weight="600" fill="#333333">Professional Experience</text><rect x="39" y="418" width="200" height="3" fill="#DE1D3E"/></g>
<text x="39" y="455" font-family="Poppins, sans-serif" font-size="16" font-weight="500" fill="#333333">Product Designer</text>
<text x="572" y="452" font-family="Poppins, sans-serif" font-size="12" font-weight="500" fill="rgba(51,51,51,0.5)" text-anchor="end">Jun 2025 – Present</text>
<text x="39" y="476" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#DE1D3E">Meesho (Valmo Transportation)</text>
<text x="39" y="512" font-family="Poppins, sans-serif" font-size="14" font-weight="500" fill="#333333">Transporter Panel: SetuX<tspan fill="#DE1D3E" font-weight="400">  (live flagship)</tspan></text>
<text x="39" y="536" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#333333"><tspan x="39" dy="0">•  Designed SetuX, a unified transporter platform to accept trips,</tspan><tspan x="54" dy="21">assign vehicles and drivers, track execution, confirm cost, and raise</tspan><tspan x="54" dy="21">disputes, replacing scattered email and WhatsApp workflows.</tspan></text>
<text x="39" y="603" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#333333"><tspan x="39" dy="0">•  Led the V1→V2 redesign that made completed trips clearer and added</tspan><tspan x="54" dy="21">Hindi audio for low-literacy partners, lifting cost visibility from</tspan><tspan x="54" dy="21">~70% to ~96%.</tspan></text>
<text x="39" y="670" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#333333"><tspan x="39" dy="0">•  Designed the upfront cost-acknowledgement flow, cutting invoice</tspan><tspan x="54" dy="21">errors from ~20% to under 2% (~₹10 Cr impact).</tspan></text>
<text x="39" y="716" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#333333"><tspan x="39" dy="0">•  Designed the disputes flow to raise, track, and resolve issues in one</tspan><tspan x="54" dy="21">place, cutting the payout cycle from ~90 to ~7 days (NPS &gt; 60).</tspan></text>
<text x="39" y="770" font-family="Poppins, sans-serif" font-size="14" font-weight="500" fill="#333333">TMS Admin: Trip Creation, Placement &amp; Multi-Origin</text>
<text x="39" y="794" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#333333"><tspan x="39" dy="0">•  Designed the Area Manager admin panel for bulk trip creation, turning</tspan><tspan x="54" dy="21">managers into active moderators of data quality across ~100 sort</tspan><tspan x="54" dy="21">centres (97% cost visibility, 99% compliance).</tspan></text>
<text x="39" y="861" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#333333"><tspan x="39" dy="0">•  Redesigned multi-origin trip creation into a simple 2-click route</tspan><tspan x="54" dy="21">builder, removing two workarounds that were corrupting trip data.</tspan></text>
<text x="39" y="915" font-family="Poppins, sans-serif" font-size="14" font-weight="500" fill="#333333">Contract Management: CLH<tspan fill="#DE1D3E" font-weight="400">  (designing 0→1)</tspan></text>
<text x="39" y="939" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#333333"><tspan x="39" dy="0">•  Designing Valmo's contract-lifecycle system from 0→1, turning route</tspan><tspan x="54" dy="21">plans into signed, running vendor contracts and replacing an offline</tspan><tspan x="54" dy="21">spreadsheet process with one auditable source of truth.</tspan></text>
<text x="39" y="1006" font-family="Poppins, sans-serif" font-size="14" font-weight="400" fill="#333333"><tspan x="39" dy="0">•  Modeled the full contract lifecycle and designed the CLH manager</tspan><tspan x="54" dy="21">workspace to assign transporters and rates (with cost guardrails and</tspan><tspan x="54" dy="21">best-fit suggestions) plus a transporter side to review and accept,</tspan><tspan x="54" dy="21">across 14 flows and 130+ screens.</tspan></text>
</g>
